<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みんなのラテアート ｜ Latte Art Breaker</title>
<meta name="description" content="机の上を流れていくラテアート。なぞると崩れます。気に入ったらハートを送ってください。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body class="gal">

<header class="galhead">
  <a class="galhead__back" href="index.html">← 自分で描く</a>
  <p class="galhead__eyebrow">EVERYONE'S LATTE ART</p>
  <h1 class="galhead__title">みんなのラテアート</h1>
  <p class="galhead__lead">
    机の上を、みんなの一杯が 3 段になって流れていきます。<br>
    <b>カップの上をなぞると崩れます。</b>気に入ったらハートを送ってください
  </p>
</header>

<!-- ============ 机 ============
     カップは区切りを持たず、机の上に無造作に並んでいます。
     3 段のコンベアで、真ん中の段だけ逆向き（左から右）に流れます。
     ブラウザが同時に持てる WebGL は 16 個までなので（実測）、
     使う数を決め打ちにし、端から出た席に次の作品を注ぎ直します。 -->
<main class="desk" data-desk data-lanes="3">
  <div class="desk__band" data-band aria-live="polite"></div>
  <p class="desk__msg" data-msg>机を用意しています…</p>
</main>

<p class="desk__hint" data-hint hidden>
  なぞると崩れます。つかんで横へ払うと、見たい一杯まで送れます
</p>

<div class="bar" role="group" aria-label="すべての杯に効く設定">
  <label class="bar__item">
    <span class="bar__name">混ざりやすさ</span>
    <input id="rng-strength" type="range" min="0.9" max="1.6" step="0.05" value="1">
    <output id="out-strength">1</output>
  </label>
  <label class="bar__item">
    <span class="bar__name">ゆるさ</span>
    <input id="rng-visc" type="range" min="0.05" max="0.475" step="0.005" value="0.26">
    <output id="out-visc">0.26</output>
  </label>
  <label class="chk"><input type="checkbox" id="chk-steam" checked> 湯気</label>
</div>

<footer class="footer">
  <p>Latte Art Breaker</p>
  <p class="footer__sub">投稿はすべて名無しです。崩しても、元の投稿は変わりません</p>
</footer>

<script src="config.js"></script>
<script src="latte.js"></script>
<script src="gallery.js"></script>
</body>
</html>
